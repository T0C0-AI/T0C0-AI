<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="COWORK KOREA — 채팅으로 앱을 만드는 종합 코워크 IDE">
  <defs>
    <linearGradient id="ckBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    .mono { font-family: 'Cascadia Code', 'D2Coding', Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="800" height="500" fill="#0D1117"/>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#21262D" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="6" fill="url(#ckBar)"/>

  <rect x="40" y="44" width="64" height="30" fill="#111827" stroke="#6366F1" stroke-width="1"/>
  <text x="72" y="64" class="mono" font-size="14" fill="#6366F1" text-anchor="middle" letter-spacing="2">IDE</text>

  <text x="40" y="150" font-size="46" font-weight="700" fill="#F3F4F6">COWORK KOREA</text>

  <text x="40" y="220" font-size="23" fill="#9CA3AF">비개발자·바이브 코더가 채팅으로 앱을 만들고</text>
  <text x="40" y="256" font-size="23" fill="#9CA3AF">안정성·보안까지 자동으로 챙기는 코워크 IDE</text>
  <text x="40" y="300" font-size="17" fill="#6B7280">만들고 → 안 무너지고 → 안 터지고 → 안 털리고 → 출시까지</text>

  <g class="mono" font-size="14" fill="#D1D5DB">
    <rect x="40" y="420" width="118" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="99" y="441" text-anchor="middle">TypeScript</text>

    <rect x="174" y="420" width="86" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="217" y="441" text-anchor="middle">React</text>

    <rect x="276" y="420" width="112" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="332" y="441" text-anchor="middle">Electron</text>

    <rect x="404" y="420" width="76" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="442" y="441" text-anchor="middle">Vite</text>
  </g>
</svg>
