<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FixMyPC — 맥 클리너 데스크탑 앱">
  <defs>
    <linearGradient id="fmBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    .mono { font-family: 'Cascadia Code', 'D2Coding', Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="800" height="500" fill="#0D1117"/>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#21262D" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="6" fill="url(#fmBar)"/>

  <rect x="40" y="44" width="104" height="30" fill="#111827" stroke="#8B5CF6" stroke-width="1"/>
  <text x="92" y="64" class="mono" font-size="14" fill="#8B5CF6" text-anchor="middle" letter-spacing="2">UTILITY</text>

  <text x="40" y="150" font-size="58" font-weight="700" fill="#F3F4F6">FixMyPC</text>

  <text x="40" y="220" font-size="23" fill="#9CA3AF">맥이 느려지고 포트가 막힐 때, 원인을 찾아</text>
  <text x="40" y="256" font-size="23" fill="#9CA3AF">버튼 하나로 끝내는 로컬 클리너</text>
  <text x="40" y="300" font-size="17" fill="#6B7280">숫자를 보여주는 앱이 아니라 문제를 끝내는 앱</text>

  <g class="mono" font-size="14" fill="#D1D5DB">
    <rect x="40" y="420" width="72" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="76" y="441" text-anchor="middle">Rust</text>

    <rect x="122" y="420" width="90" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="167" y="441" text-anchor="middle">Tauri</text>

    <rect x="222" y="420" width="86" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="265" y="441" text-anchor="middle">React</text>

    <rect x="318" y="420" width="118" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="377" y="441" text-anchor="middle">TypeScript</text>
  </g>
</svg>
