<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selah — 1인용 로컬 성경 공부 앱">
  <defs>
    <linearGradient id="slBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FFC831"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    .mono { font-family: 'Cascadia Code', 'D2Coding', Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="800" height="500" fill="#0D1117"/>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#21262D" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="6" fill="url(#slBar)"/>

  <rect x="40" y="44" width="112" height="30" fill="#111827" stroke="#D97706" stroke-width="1"/>
  <text x="96" y="64" class="mono" font-size="14" fill="#FFC831" text-anchor="middle" letter-spacing="2">PERSONAL</text>

  <text x="40" y="150" font-size="58" font-weight="700" fill="#F3F4F6">Selah</text>

  <text x="40" y="220" font-size="23" fill="#9CA3AF">성경 본문을 책처럼 통째로 읽되, 저자·시대·</text>
  <text x="40" y="256" font-size="23" fill="#9CA3AF">하나님의 성품을 옆에서 펼쳐보는 성경 앱</text>
  <text x="40" y="300" font-size="17" fill="#6B7280">1인용 · 로컬 우선 — 광고도 트래킹도 없다</text>

  <g class="mono" font-size="14" fill="#D1D5DB">
    <rect x="40" y="420" width="118" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="99" y="441" text-anchor="middle">TypeScript</text>

    <rect x="174" y="420" width="112" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="230" y="441" text-anchor="middle">Electron</text>

    <rect x="302" y="420" width="76" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="340" y="441" text-anchor="middle">Vite</text>
  </g>
