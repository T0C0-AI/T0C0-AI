<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="블랙토코 — AI 레드팀 워크벤치">
  <defs>
    <linearGradient id="btBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    .mono { font-family: 'Cascadia Code', 'D2Coding', Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="800" height="500" fill="#0D1117"/>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#21262D" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="6" fill="url(#btBar)"/>

  <rect x="40" y="44" width="130" height="30" fill="#111827" stroke="#EF4444" stroke-width="1"/>
  <text x="105" y="64" class="mono" font-size="14" fill="#EF4444" text-anchor="middle" letter-spacing="2">SECURITY</text>

  <text x="40" y="150" font-size="52" font-weight="700" fill="#F3F4F6">블랙토코</text>

  <text x="40" y="220" font-size="23" fill="#9CA3AF">AI 레드팀이 공격하고 AI 블루팀이 방어하며</text>
  <text x="40" y="256" font-size="23" fill="#9CA3AF">배포 전 보안 구멍을 찾는 로컬 AI 워크벤치</text>
  <text x="40" y="300" font-size="17" fill="#6B7280">정찰·로그인 우회·실제 CVE 공격 시뮬레이션 → 자동 방어 검증</text>

  <g class="mono" font-size="14" fill="#D1D5DB">
    <rect x="40" y="420" width="130" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="105" y="441" text-anchor="middle">JavaScript</text>

    <rect x="186" y="420" width="112" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="242" y="441" text-anchor="middle">Electron</text>

    <rect x="314" y="420" width="96" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="362" y="441" text-anchor="middle">Docker</text>

    <rect x="426" y="420" width="96" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="474" y="441" text-anchor="middle">Python</text>
  </g>
</svg>
