<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="와이파이 지킴이 — 공유기 보안 감시 앱">
  <defs>
    <linearGradient id="wgBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    .mono { font-family: 'Cascadia Code', 'D2Coding', Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="800" height="500" fill="#0D1117"/>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#21262D" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="6" fill="url(#wgBar)"/>

  <rect x="40" y="44" width="130" height="30" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="105" y="64" class="mono" font-size="14" fill="#10B981" text-anchor="middle" letter-spacing="2">SECURITY</text>

  <text x="40" y="150" font-size="52" font-weight="700" fill="#F3F4F6">와이파이 지킴이</text>

  <text x="40" y="220" font-size="23" fill="#9CA3AF">공유기 보안 취약점을 CISA KEV 기반으로</text>
  <text x="40" y="256" font-size="23" fill="#9CA3AF">매일 자동 감시하는 개인용 보안 앱</text>
  <text x="40" y="300" font-size="17" fill="#6B7280">위협 정보(threat-intel) 레포를 별도로 두고 매일 자동 갱신한다</text>

  <g class="mono" font-size="14" fill="#D1D5DB">
    <rect x="40" y="420" width="86" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="83" y="441" text-anchor="middle">Kotlin</text>

    <rect x="136" y="420" width="106" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="189" y="441" text-anchor="middle">Android</text>

    <rect x="252" y="420" width="96" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="300" y="441" text-anchor="middle">Python</text>
  </g>
</svg>
