<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Korea Live — 대한민국 실시간 인텔리전스 대시보드">
  <defs>
    <linearGradient id="klBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    .mono { font-family: 'Cascadia Code', 'D2Coding', Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="800" height="500" fill="#0D1117"/>
  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#21262D" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="6" fill="url(#klBar)"/>

  <rect x="40" y="44" width="150" height="30" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="115" y="64" class="mono" font-size="14" fill="#3B82F6" text-anchor="middle" letter-spacing="2">DASHBOARD</text>

  <text x="40" y="150" font-size="58" font-weight="700" fill="#F3F4F6">Korea Live</text>

  <text x="40" y="220" font-size="23" fill="#9CA3AF">대한민국 상황을 실시간으로 모아 보여주는</text>
  <text x="40" y="256" font-size="23" fill="#9CA3AF">개인용 인텔리전스 대시보드</text>
  <text x="40" y="300" font-size="17" fill="#6B7280">사실과 주장을 구분하고, 로컬 AI가 기사를 분류·요약한다</text>

  <g class="mono" font-size="14" fill="#D1D5DB">
    <rect x="40" y="420" width="106" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="93" y="441" text-anchor="middle">JavaScript</text>

    <rect x="156" y="420" width="96" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="204" y="441" text-anchor="middle">Node.js</text>

    <rect x="262" y="420" width="112" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="318" y="441" text-anchor="middle">Capacitor</text>

    <rect x="384" y="420" width="150" height="32" fill="#161B22" stroke="#30363D"/>
    <text x="459" y="441" text-anchor="middle">On-device AI</text>
  </g>
</svg>
